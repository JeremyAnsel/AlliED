name: Build Windows

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      ARTIFACT_NAME: AlliED-Windows
      PACKAGE_NAME: AlliED.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: msbuild AlliED/AlliED.sln /t:Restore /p:Configuration=Release

      - name: Build solution
        run: msbuild AlliED/AlliED.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Set release package name
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_NAME=AlliED-$version.zip"

      - name: Package application
        shell: pwsh
        run: |
          $outputDirectory = "AlliED/AlliED/bin/Release/net48"
          $packageDirectory = "artifacts/AlliED"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item -Path "$outputDirectory/*" -Destination $packageDirectory -Recurse -Force
          Compress-Archive -Path "$packageDirectory/*" -DestinationPath "artifacts/$env:PACKAGE_NAME" -Force

      - name: Append commit SHA to artifact name
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT_NAME=AlliED-Windows-$($env:GITHUB_SHA.Substring(0, 7))"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/${{ env.PACKAGE_NAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ env.PACKAGE_NAME }}
          generate_release_notes: true
