image: Visual Studio 2022
version: 2.0.{build}
configuration: Release

init:
- if "%APPVEYOR_REPO_NAME%" == "JeremyAnsel/AlliED" if "%APPVEYOR_REPO_BRANCH%"=="main" if not defined APPVEYOR_PULL_REQUEST_NUMBER set DEPLOY=True

dotnet_csproj:
  patch: true
  file: '**\*.csproj'
  version: '{version}'

nuget:
  disable_publish_on_pr: true

before_build:
- nuget restore AlliED\AlliED.sln

build:
  project: AlliED\AlliED.sln
  verbosity: minimal

after_build:
- AlliED\build-dist.cmd

artifacts:
- path: AlliED\dist
  name: AlliED-$(APPVEYOR_BUILD_VERSION)
  type: zip
